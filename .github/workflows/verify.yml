name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      APP_ENV: test
      AUTH_MODE: better-auth
      PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PG_DEV_URL: postgresql://resume_opt_app:ci-app-password@127.0.0.1:5432/resume_opt_dev
      PG_AUTH_URL: postgresql://resume_opt_auth:ci-auth-password@127.0.0.1:5432/resume_opt_dev
      PG_MIGRATION_URL: postgresql://resume_opt_migrator:ci-migrator-password@127.0.0.1:5432/resume_opt_dev
      PG_PRIVACY_URL: postgresql://resume_opt_privacy:ci-privacy-password@127.0.0.1:5432/resume_opt_test
      PG_TEST_URL: postgresql://resume_opt_test:ci-test-password@127.0.0.1:5432/resume_opt_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-chars
      DATABASE_POOL_MAX: "5"
      NEXT_PUBLIC_APP_NAME: AI 简历平台
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare ephemeral test databases
        run: |
          touch .env.local
          pnpm ci:provision

      - name: Run complete V0.2 verification gate
        id: quality
        run: |
          pnpm ci:full
          pnpm test:migrations

      - name: Prepare fixed browser-test fixture
        id: fixture
        env:
          APP_ENV: local
          AUTH_MODE: fixed
          DEV_FIXED_USER_ID: 00000000-0000-4000-8000-000000000001
          DEV_FIXED_RESUME_ID: 00000000-0000-4000-8000-000000000002
          DEV_FIXED_VERSION_ID: 00000000-0000-4000-8000-000000000003
        run: |
          pnpm db:migrate
          pnpm db:seed:dev

      - name: Verify fixed-identity native Chrome matrix
        id: fixed_browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm test:browser:fixed

      - name: Verify real-auth native Chrome matrix
        id: auth_browser
        if: always() && steps.quality.outcome == 'success' && steps.fixture.outcome == 'success'
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm test:browser:auth

      - name: Rehearse native pg_dump and pg_restore
        id: native_restore
        if: always()
        env:
          PG_NATIVE_RESTORE_MODE: docker
          PG_NATIVE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm ops:restore:native -- --output artifacts/ci/native-restore.json

      - name: Build sanitized verification manifest
        if: always()
        env:
          EVIDENCE_QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          EVIDENCE_FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          EVIDENCE_FIXED_BROWSER_OUTCOME: ${{ steps.fixed_browser.outcome }}
          EVIDENCE_AUTH_BROWSER_OUTCOME: ${{ steps.auth_browser.outcome }}
          EVIDENCE_NATIVE_RESTORE_OUTCOME: ${{ steps.native_restore.outcome }}
        run: pnpm ci:evidence

      - name: Preserve sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-evidence-${{ github.run_id }}
          path: platform/artifacts/ci
          if-no-files-found: error
          retention-days: 30
